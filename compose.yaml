# 自作の実験環境専用。所有する環境でのみ起動すること。実際の個人情報を入力しないこと。
# Mailpit とメール配信つきテストサイト（honest / evil）をまとめて起動する。ポートはすべてホストの 127.0.0.1 にだけ公開する。
# 注意: この compose.yaml は作成者の環境では未検証（Docker が無いため）。検証済みの手順は `python3 e2e/run_mail_e2e.py`（Mailpit バイナリを直接起動）。
#   docker compose up -d
#   python3 e2e/run_mail_e2e.py --mailpit-api http://127.0.0.1:8025 --mailpit-smtp-port 1025
#   （E2E スクリプトはテストサイトを自分で起動する。下の honest / evil は手で画面を見るためのもの）
services:
  mailpit:
    image: axllent/mailpit:v1.31.5
    command: ["--disable-version-check", "--smtp-disable-rdns", "--block-remote-css-and-fonts"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  honest:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["./testsite_mail:/app:ro"]
    # コンテナの中では 0.0.0.0 で待ち受ける（ホストへは 127.0.0.1 にだけ公開）。メール内リンクは 127.0.0.1 を指す
    command: ["python3", "server_mail.py", "--mode", "honest", "--port", "8781", "--bind", "0.0.0.0",
              "--smtp-host", "mailpit", "--allow-smtp-host", "mailpit", "--public-base", "http://127.0.0.1:8781"]
    ports: ["127.0.0.1:8781:8781"]
    depends_on: [mailpit]
  evil:
    image: python:3.13-slim
    working_dir: /app
    volumes: ["./testsite_mail:/app:ro"]
    command: ["python3", "server_mail.py", "--mode", "evil", "--port", "8782", "--bind", "0.0.0.0",
              "--smtp-host", "mailpit", "--allow-smtp-host", "mailpit", "--public-base", "http://127.0.0.1:8782"]
    ports: ["127.0.0.1:8782:8782"]
    depends_on: [mailpit]
